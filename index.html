<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday, My Jiya Jan ❤️</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            height: 100%;
            font-family: 'Georgia', serif;
            overflow-x: hidden;
            overflow-y: auto;
            background-color: #1a0f1a;
        }

        /* Background Image Layout */
        .bg-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('IMG_20260526_151751.jpg');
            background-size: cover;
            background-position: center;
            filter: blur(3px) brightness(0.45);
            z-index: -1;
            transform: scale(1.05);
            animation: gentlePulse 12s infinite alternate ease-in-out;
        }

        @keyframes gentlePulse {
            0% { transform: scale(1.05); }
            100% { transform: scale(1.12); }
        }

        /* Main Showcase Layout Grid */
        .container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            gap: 40px;
            padding: 30px;
            position: relative;
            z-index: 10;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Elegant Side Frame Photos */
        .side-photo-frame {
            width: 260px;
            height: 400px;
            border-radius: 20px;
            overflow: hidden;
            border: 3px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 10px 25px rgba(255, 77, 109, 0.4), 0 0 15px rgba(255, 255, 255, 0.1);
            background-size: cover;
            background-position: center;
            transition: all 0.5s ease;
            animation: floatFrame 4s infinite alternate ease-in-out;
            flex-shrink: 0;
        }

        .side-photo-frame.left-img {
            background-image: url('Screenshot_20260526_171845.jpg');
            animation-delay: 0s;
        }

        .side-photo-frame.right-img {
            background-image: url('Screenshot_20260526_171853.jpg');
            animation-delay: 1s;
        }

        .side-photo-frame:hover {
            transform: scale(1.05) rotate(1deg);
            border-color: #ff4d6d;
            box-shadow: 0 15px 35px rgba(255, 77, 109, 0.7);
        }

        @keyframes floatFrame {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-15px); }
        }

        /* Glassmorphism Romantic Wish Card */
        .wish-card {
            background: rgba(255, 182, 193, 0.12);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 40px 25px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 35px 0 rgba(255, 77, 109, 0.3);
            width: 100%;
            max-width: 420px;
            text-align: center;
            animation: fadeInDown 1.4s ease-out;
            flex-shrink: 0;
        }

        h1 {
            font-size: 2.8rem;
            color: #ff4d6d;
            text-shadow: 0 0 12px rgba(255, 77, 109, 0.6);
            margin-bottom: 5px;
            font-family: 'Brush Script MT', cursive, sans-serif;
        }

        .sub-name {
            font-size: 2.2rem;
            color: #fff0f3;
            margin-bottom: 15px;
            font-weight: bold;
            letter-spacing: 1px;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.6);
        }

        p.romantic-text {
            font-size: 1.05rem;
            line-height: 1.6;
            margin-bottom: 25px;
            color: #ffe5ec;
            font-style: italic;
        }

        /* Celebration Interactive Button */
        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 5px;
        }

        .btn {
            background: linear-gradient(45deg, #ff4d6d, #ff758f);
            color: white;
            border: none;
            padding: 12px 40px;
            font-size: 1.05rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 77, 109, 0.4);
            transition: all 0.3s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 20px rgba(255, 77, 109, 0.6);
        }

        .btn:active {
            transform: scale(0.97);
        }

        /* Birthday Cake Visuals */
        .cake-container {
            margin-top: 25px;
            position: relative;
            display: inline-block;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .cake {
            width: 110px;
            height: 75px;
            background: #ffb3c1;
            border-radius: 12px 12px 0 0;
            position: relative;
            margin: 0 auto;
            box-shadow: inset 0 -10px 0 #ff85a1, 0 6px 12px rgba(0,0,0,0.25);
        }

        .cake::before {
            content: '';
            position: absolute;
            top: 25px;
            left: 0;
            width: 100%;
            height: 12px;
            background: #fff0f3;
        }

        .candle {
            width: 6px;
            height: 28px;
            background: #ff4d6d;
            position: absolute;
            top: -28px;
            left: 52px;
            border-radius: 4px;
        }

        .flame {
            width: 12px;
            height: 18px;
            background: #ffb703;
            border-radius: 50% 50% 20% 20%;
            position: absolute;
            top: -20px;
            left: -3px;
            box-shadow: 0 0 12px #ffb703, 0 0 4px #fff;
            animation: flicker 0.6s infinite alternate;
        }

        @keyframes flicker {
            0% { transform: scale(1); }
            100% { transform: scale(1.15) skewX(4deg); }
        }

        /* Heart Floating Elements */
        .heart-particle {
            position: fixed;
            pointer-events: none;
            z-index: 999;
            animation: flyUp 3.8s linear forwards;
        }

        @keyframes flyUp {
            0% {
                transform: translateY(105vh) translateX(0) scale(0);
                opacity: 1;
            }
            100% {
                transform: translateY(-10vh) translateX(var(--drift)) scale(1.5);
                opacity: 0;
            }
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Twinkling Sparkles */
        .sparkle {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: pulseSparkle 2.5s infinite;
            pointer-events: none;
        }

        @keyframes pulseSparkle {
            0%, 100% { transform: scale(0); opacity: 0; }
            50% { transform: scale(1); opacity: 0.7; }
        }

        /* Responsive Layout Updates for Mobile Devices */
        @media (max-width: 950px) {
            .container {
                flex-direction: column;
                justify-content: flex-start;
                overflow-y: auto;
                gap: 25px;
                padding-top: 40px;
            }
            .wish-card {
                order: 1;
            }
            .side-photo-frame {
                order: 2;
                width: 150px;
                height: 230px;
                display: inline-block;
            }
            .photo-wrapper {
                display: flex;
                gap: 15px;
                order: 2;
                justify-content: center;
                width: 100%;
                margin-bottom: 30px;
            }
        }
    </style>
</head>
<body>

    <div class="bg-image"></div>

    <audio id="birthday-song" loop playsinline prefetch>
        <source src="https://html5tutorial.info/media/vincent.mp3" type="audio/mpeg">
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>

    <div class="container">
        <div class="side-photo-frame left-img"></div>

        <div class="wish-card">
            <h1>Happy Birthday</h1>
            <div class="sub-name">My Jiya Jan ❤️</div>
            
            <p class="romantic-text">
                "On this beautiful day, the world became brighter because you were born. 
                You are my joy, my heartbeat, and my forever love."
            </p>

            <div class="btn-group">
                <button class="btn" onclick="celebrateHearts()">Celebrate ❤️</button>
            </div>

            <div class="cake-container" onclick="blowCandle()" id="cakeBox">
                <div class="candle">
                    <div class="flame" id="candleFlame"></div>
                </div>
                <div class="cake"></div>
                <p style="margin-top: 12px; font-size: 0.85rem; color: #ffb3c1; font-weight: bold;">✨ Tap Candle to Cut & Play Music ✨</p>
            </div>
        </div>

        <div class="side-photo-frame right-img"></div>
    </div>

    <script>
        // Adjust elements automatically for seamless mobile screen support
        function checkMobileWrapper() {
            if (window.innerWidth <= 950) {
                let wrapper = document.querySelector('.photo-wrapper');
                if (!wrapper) {
                    wrapper = document.createElement('div');
                    wrapper.className = 'photo-wrapper';
                    const leftImg = document.querySelector('.left-img');
                    const rightImg = document.querySelector('.right-img');
                    const container = document.querySelector('.container');
                    
                    if(leftImg && rightImg) {
                        wrapper.appendChild(leftImg);
                        wrapper.appendChild(rightImg);
                        container.appendChild(wrapper);
                    }
                }
            } else {
                let wrapper = document.querySelector('.photo-wrapper');
                if (wrapper) {
                    const leftImg = document.querySelector('.left-img');
                    const rightImg = document.querySelector('.right-img');
                    const container = document.querySelector('.container');
                    const wishCard = document.querySelector('.wish-card');
                    
                    container.insertBefore(leftImg, wishCard);
                    container.appendChild(rightImg);
                    wrapper.remove();
                }
            }
        }
        window.addEventListener('resize', checkMobileWrapper);
        window.addEventListener('load', checkMobileWrapper);

        // Starry Sparkles Generator
        function createSparkles() {
            const container = document.body;
            for (let i = 0; i < 25; i++) {
                let sparkle = document.createElement('div');
                sparkle.className = 'sparkle';
                let size = Math.random() * 4 + 2;
                sparkle.style.width = size + 'px';
                sparkle.style.height = size + 'px';
                sparkle.style.left = Math.random() * 100 + 'vw';
                sparkle.style.top = Math.random() * 100 + 'vh';
                sparkle.style.animationDelay = Math.random() * 2 + 's';
                container.appendChild(sparkle);
            }
        }
        createSparkles();

        // Heart Flow Engine
        function celebrateHearts() {
            const song = document.getElementById('birthday-song');
            song.play().catch(e => console.log("Audio waiting for touch..."));

            for (let i = 0; i < 45; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.className = 'heart-particle';
                    const heartsArray = ['❤️', '💖', '💕', '💘', '✨', '🌸'];
                    heart.innerText = heartsArray[Math.floor(Math.random() * heartsArray.length)];
                    
                    heart.style.left = Math.random() * 100 + 'vw';
                    heart.style.bottom = '-5vh';
                    heart.style.fontSize = Math.random() * 16 + 16 + 'px';
                    
                    const driftDir = (Math.random() - 0.5) * 180;
                    heart.style.setProperty('--drift', driftDir + 'px');
                    heart.style.animationDuration = Math.random() * 1.5 + 2.2 + 's';
                    
                    document.body.appendChild(heart);
                    setTimeout(() => { heart.remove(); }, 3800);
                }, i * 65);
            }
        }

        // Candle Blow Out Event Handler
        function blowCandle() {
            const flame = document.getElementById('candleFlame');
            const song = document.getElementById('birthday-song');

            if (flame.style.display !== 'none') {
                flame.style.display = 'none';
                song.play().catch(err => {
                    console.log("Audio play blocked by browser policies.");
                });
                celebrateHearts();
            } else {
                flame.style.display = 'block';
                song.pause();
            }
        }
    </script>
</body>
</html>
